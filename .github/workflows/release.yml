name: Release Thunderbird Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create ZIP archive
        run: |
          zip -r delete_all_messages.zip manifest.json background.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: delete_all_messages.zip
