name: Release Thunderbird Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create ZIP archive
        run: |
          zip -r "delete_all_messages-${VERSION}.zip" manifest.json background.js

      - name: Verify ZIP file exists
        run: |
          if [ ! -f "delete_all_messages-${VERSION}.zip" ]; then
            echo "Error: delete_all_messages-${VERSION}.zip not found!"
            exit 1
          fi

      - name: Upload Release
        uses: ncipollo/release-action@v1.13.0
        with:
          artifacts: "delete_all_messages-${{ env.VERSION }}.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
